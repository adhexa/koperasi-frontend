name: CI/CD Pipeline - Frontend Service

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/adhexa/koperasi-merah-putih-frontend

jobs:
  build-and-push:
    name: 1. Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: 2. Deploy (Rolling Update)
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deploy via SSH (Docker Compose)
        run: |
          ssh -o StrictHostKeyChecking=no -p 2202 adha@127.0.0.1 "docker pull ${{ env.IMAGE_NAME }}:latest && docker tag ${{ env.IMAGE_NAME }}:latest koperasi-merah-putih-frontend-frontend-instance-1 && docker tag ${{ env.IMAGE_NAME }}:latest koperasi-merah-putih-frontend-frontend-instance-2 && cd ~/koperasi-merah-putih-frontend && docker compose up -d --no-build"

  readiness-probe:
    name: 3. Health & Readiness Probe
    needs: deploy
    runs-on: self-hosted
    steps:
      - name: Real Readiness HTTP Probe Check
        run: |
          ssh -o StrictHostKeyChecking=no -p 2202 adha@127.0.0.1 "for i in {1..5}; do curl -f -s http://localhost:80 > /dev/null && echo 'HTTP 200 OK: Frontend Container Ready!' && exit 0 || sleep 3; done; echo 'Readiness Probe Failed!'; exit 1"

  traffic-cutover:
    name: 4a. Switch Traffic to New Pod
    needs: readiness-probe
    if: success()
    runs-on: self-hosted
    steps:
      - name: Verify & Finalize Live Traffic Routing
        run: |
          ssh -o StrictHostKeyChecking=no -p 2202 adha@127.0.0.1 "curl -sI http://localhost:80 && cd ~/koperasi-merah-putih-frontend && docker compose ps"

  auto-rollback:
    name: 4b. Automatic Rollback (On Failure)
    needs: readiness-probe
    if: failure()
    runs-on: self-hosted
    steps:
      - name: Execute Real Automatic Rollback
        run: |
          ssh -o StrictHostKeyChecking=no -p 2202 adha@127.0.0.1 "echo 'Initiating Rollback...' && cd ~/koperasi-merah-putih-frontend && docker compose up -d --force-recreate"

  observability-notify:
    name: 5. Observability & Log Notification
    needs: [traffic-cutover, auto-rollback]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Collect Container Metrics & Logs
        run: |
          ssh -o StrictHostKeyChecking=no -p 2202 adha@127.0.0.1 "echo '=== DOCKER STATS ===' && docker stats --no-stream && echo '=== CONTAINER LOGS ===' && docker logs --tail 20 frontend-service-1 || true"
