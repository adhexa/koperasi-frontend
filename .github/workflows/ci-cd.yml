name: CI/CD Pipeline - Frontend Service (K3s)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/adhexa/koperasi-merah-putih-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deploy via SSH (Docker Compose)
        run: |
          ssh -p 2202 adha@127.0.0.1 "docker pull ${{ env.IMAGE_NAME }}:latest && docker tag ${{ env.IMAGE_NAME }}:latest koperasi-merah-putih-frontend-frontend-instance-1 && docker tag ${{ env.IMAGE_NAME }}:latest koperasi-merah-putih-frontend-frontend-instance-2 && cd ~/koperasi-merah-putih-frontend && docker compose up -d --no-build"
