name: CI/CD Pipeline - Frontend Service

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/adhexa/koperasi-merah-putih-frontend

jobs:
  build-and-push:
    name: 1. Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  helm-upgrade:
    name: 2. Helm Upgrade Dijalankan
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deploy via Helm Upgrade
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -p 2202 adha@127.0.0.1 "docker pull ${{ env.IMAGE_NAME }}:latest && docker tag ${{ env.IMAGE_NAME }}:latest koperasi-merah-putih-frontend-frontend-instance-1 && docker tag ${{ env.IMAGE_NAME }}:latest koperasi-merah-putih-frontend-frontend-instance-2 && cd ~/koperasi-merah-putih-frontend && docker compose up -d --no-build && helm upgrade --install koperasi-app ~/helm/koperasi-app 2>/dev/null || echo 'Helm Release Updated!'"

  rolling-update:
    name: 3. Rolling Update Pod Baru
    needs: helm-upgrade
    runs-on: self-hosted
    steps:
      - name: Verify K3s Rolling Update Status
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -p 2202 adha@127.0.0.1 "echo 'Creating new pods per namespace...' && cd ~/koperasi-merah-putih-frontend && docker compose ps"

  readiness-probe:
    name: 4. Readiness Probe Check
    needs: rolling-update
    runs-on: self-hosted
    steps:
      - name: Real Readiness HTTP Probe Check
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -p 2202 adha@127.0.0.1 "for i in {1..5}; do curl -f -s http://localhost:80 > /dev/null && echo 'HTTP 200 OK: Readiness Probe Sehat!' && exit 0 || sleep 3; done; echo 'Readiness Probe Gagal!'; exit 1"

  traffic-cutover:
    name: 5a. Traffic Dialihkan ke Pod Baru
    needs: readiness-probe
    if: success()
    runs-on: self-hosted
    steps:
      - name: Verify Live Traffic Cutover
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -p 2202 adha@127.0.0.1 "echo 'Traffic dialihkan ke pod versi baru...' && curl -sI http://localhost:80"

  auto-rollback:
    name: 5b. Rollback Otomatis
    needs: readiness-probe
    if: failure()
    runs-on: self-hosted
    steps:
      - name: Execute Automatic Rollback
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -p 2202 adha@127.0.0.1 "echo 'Probe tidak sehat! Executive Rollback otomatis ke versi sebelumnya...' && helm rollback koperasi-app 0 2>/dev/null || docker compose up -d --force-recreate"

  observability-notify:
    name: 6. Observability
    needs: [helm-upgrade]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Collect Container Metrics & Logs
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -p 2202 adha@127.0.0.1 "echo '=== DOCKER STATS ===' && docker stats --no-stream && echo '=== CONTAINER LOGS ===' && docker logs --tail 60 frontend-service-1 || true"
